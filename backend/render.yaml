# Render Blueprint: Web service + managed Postgres
databases:
  - name: blog-db
    plan: free
services:
  - type: web
    name: blog-api
    runtime: node
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: blog-db, property: connectionString }
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://YOUR-FRONTEND-URL
